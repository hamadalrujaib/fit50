<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit50 - صحتك ولياقتك</title>
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 28px;
        }
        header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 18px;
            margin-top: 0;
            color: var(--primary);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: var(--text);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Fit50</h1>
            <p>برنامجك الصحي والرياضي المتكامل (عمر 50+)</p>
        </header>

        <!-- قسم القياسات الحيوية -->
        <div class="card">
            <h2>القياسات الأساسية</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value">76 كغ</div>
                    <div class="stat-label">الوزن الحالي</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value">171 سم</div>
                    <div class="stat-label">الطول</div>
                </div>
            </div>
        </div>

        <!-- قسم التحاليل الطبية -->
        <div class="card">
            <h2>المؤشرات الطبية الحيوية</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="hba1c-val">---</div>
                    <div class="stat-label">التراكمي HbA1c</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="b12-val">---</div>
                    <div class="stat-label">فيتامين B12</div>
                </div>
            </div>
        </div>

        <!-- زر تفاعلي -->
        <button onclick="updateData()">تحديث السجلات</button>
    </div>

    <script>
        function updateData() {
            // تجربة التخزين المحلي localStorage
            const sampleData = { lastSync: new Date().toLocaleString() };
            localStorage.setItem('fit50_sync', JSON.stringify(sampleData));
            alert('تم حفظ وتحديث البيانات محلياً بنجاح!');
        }
    </script>
</body>
</html>
